[project]
name = "windows-folder-sizes-diff"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "customtkinter>=6.0.0",
    "pydantic>=2.13.4",
    "pywin32>=312",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.51",
    "typer>=0.27.0",
]

[project.scripts]
folder-diff = "windows_folder_sizes_diff.app:main"
folder-diff-cli = "windows_folder_sizes_diff.cli:app"

[dependency-groups]
dev = [
    "hatchling>=1.31.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_folder_sizes_diff"]

[tool.pytest.ini_options]
pythonpath = ["src"]
